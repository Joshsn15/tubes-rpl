apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: joshsatrion/backend:v2
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: DB_HOST
              value: postgres-service
            - name: DB_USERNAME
              value: postgres
            - name: DB_PASSWORD
              value: "120506"
            - name: DB_NAME
              value: tubes_rpl_minimarket